<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexcent</title>
    <style>
        body { background: #e9ecef; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #263238; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #4CAF50; }
        .login-btn { background: #4CAF50; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .login-btn:hover { background: #388E3C; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #4CAF50; text-decoration: none; display: block; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Member Login</h2>
        <input type="text" placeholder="Username or Email">
        <input type="password" placeholder="Password">
        <button class="login-btn">Login</button>
        <div class="links">
            <a href="#">Forgot Password?</a>
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
</body>
</html>
